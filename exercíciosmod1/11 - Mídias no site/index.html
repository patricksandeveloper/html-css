<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
        <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente diminua o tamanho do seu navegador.</p>
        <picture>
            <source media="(max-width: 750px)" srcset="imagens/fotop.png.png" type="image/png">
            <source media="(max-width: 1050px)" srcset="imagens/fotom.png.png" type="image/png">
            <img src="imagens/fotog.png.png" alt="Imagem flexível">
        </picture>
    <h1>Reproduzindo Áudio</h1>
        <p>Vamos aprender a reproduzir áudios em HTML5.</p>
        <audio preload="auto" autoplay controls>
            <source src="midia/a_ultimadança.mp3" type="audio/mpeg">
            <source src="midia/a_ultimadança.ogg" type="audio/ogg">
            <source src="midia/a_ultimadança.wav" type="audio/wav">
        </audio> 
        <!--MP3 WAV OGG-->
            <p>Infelizmente seu navegador não consegue reproduzir áudios.</p>
        <ul>
            <li><a href="midia/a_ultimadança.zip" download="midia/a_ultimadança.zip" type="application/zip">Baixe aqui!</a></li>
        </ul>
</body>
</html>
