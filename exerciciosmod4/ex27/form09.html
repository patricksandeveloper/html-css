<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
        <form action="cadastro.php" method="post" autocomplete="on">
            <p>
                <label for="irange">Satisfação: </label>
                <input type="range" name="range" id="irange" min="1" max="10" value="1" oninput="ival.innerHTML = Number(irange.value)">
                <output id="ival">1</output>

            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
   
</body>
</html>
